[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distributed-rag"
version = "0.1.0"
description = "Tenant-isolated hybrid retrieval with durable, fenced indexing workers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "redis>=5,<7", "httpx[socks]>=0.28,<1",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1", "pypdf>=6,<7"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
drag = "app.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
